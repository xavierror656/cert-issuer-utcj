<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0F3E4A"/>
      <stop offset="100%" stop-color="#0A4C3B"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#B88A3B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#cardBg)"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="url(#goldBorder)" stroke-width="3" fill="none"/>
  
  <!-- Decorative Watermark -->
  <circle cx="1050" cy="120" r="140" fill="#0F6A52" fill-opacity="0.2"/>
  <circle cx="1120" cy="220" r="80" fill="#B88A3B" fill-opacity="0.15"/>
  
  <!-- Header with Enlarged Official UTCJ Emblem Logo -->
  <g transform="translate(64, 40) scale(1.45)">
    <circle cx="36" cy="36" r="34" fill="#0F3E4A" stroke="#B88A3B" stroke-width="3"/>
    <circle cx="36" cy="36" r="28" stroke="#B88A3B" stroke-width="1.2" stroke-dasharray="3 2"/>
    <path d="M22 28 L36 17 L50 28 L50 46 L36 55 L22 46 Z" fill="#0F6A52" stroke="#B88A3B" stroke-width="1.5"/>
    <text x="36" y="41" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">UTCJ</text>
  </g>

  <text x="184" y="80" fill="#B88A3B" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="3">UNIVERSIDAD TECNOLÓGICA DE CIUDAD JUÁREZ</text>
  <text x="184" y="110" fill="#E8F1EE" font-family="Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">MICROCREDENCIAL ACADÉMICA VERIFICABLE EN BLOCKCHAIN</text>
  
  <!-- Title -->
  <text x="64" y="200" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="700">Semiconductores y MEMS Avanzados</text>
  
  <!-- Recipient -->
  <text x="64" y="265" fill="#E8F1EE" font-family="Arial, sans-serif" font-size="20">Otorgada oficialmente a:</text>
  <text x="64" y="320" fill="#FFFFFF" font-family="Georgia, serif" font-size="42" font-weight="700">Egresado Destacado UTCJ</text>
  
  <!-- Verified Badge -->
  <rect x="64" y="365" width="340" height="38" rx="19" fill="#0F6A52" fill-opacity="0.6" stroke="#B88A3B" stroke-width="1"/>
  <circle cx="86" cy="384" r="6" fill="#10B981"/>
  <text x="102" y="389" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">✔ VERIFICADA EN ETHEREUM</text>
  
  <text x="64" y="445" fill="#E8F1EE" font-family="Arial, sans-serif" font-size="16">ID: 6e424670-1797-4f6f-b8a5-71a1b5241059</text>
  <text x="64" y="475" fill="#B88A3B" font-family="monospace" font-size="14">Tx: 0x6dda7713c5c5c51affe5154a1d52fe191daf53cb...</text>
  
  <!-- QR Box -->
  <rect x="940" y="340" width="190" height="210" rx="20" fill="#FFFFFF"/>
  <text x="1035" y="530" fill="#0F3E4A" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ESCANEA PARA VERIFICAR</text>
  
  <!-- Footer -->
  <line x1="64" y1="550" x2="900" y2="550" stroke="#E8F1EE" stroke-opacity="0.3" stroke-width="1"/>
  <text x="64" y="582" fill="#E8F1EE" font-family="Arial, sans-serif" font-size="14">Firma Digital del Rector: Dr. Óscar F. Ibáñez Hernández • Estándar Abierto W3C Blockcerts v3.2</text>
</svg>
